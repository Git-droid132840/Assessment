# Production-style deployment: application + PostgreSQL
# 1. Copy .env.example to .env and set the passwords
# 2. docker compose up -d --build
# 3. Open http://localhost:4000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gxpcompliance
      POSTGRES_USER: part11
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U part11 -d gxpcompliance"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://part11:${POSTGRES_PASSWORD}@db:5432/gxpcompliance
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      DISPLAY_TZ: ${DISPLAY_TZ:-Asia/Kolkata}
      DISPLAY_TZ_LABEL: ${DISPLAY_TZ_LABEL:-IST}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${APP_PORT:-4000}:4000"
    volumes:
      - uploads:/data

volumes:
  pgdata:
  uploads:
